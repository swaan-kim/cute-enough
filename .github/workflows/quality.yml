name: Application quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Installation may use the network; actual Edge tests deny it. No app secrets.
      - run: npx playwright install --with-deps chromium
      - run: npx deno cache --node-modules-dir=manual --config supabase/functions/deno.json supabase/functions/pet-api/index.ts
      - run: npm run docs:check
      - run: npm run test:flows
      - run: npm run build:web
