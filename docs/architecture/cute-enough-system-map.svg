<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">옆집 강아지 서비스 구조</title>
  <desc id="desc">사용자, Toss 미니앱, Supabase Edge API와 데이터, Toss 플랫폼, 검수와 출시 운영의 연결 구조</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#172033" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#AAB4C3"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; fill:#202938; }
      .eyebrow { font-size:18px; font-weight:700; letter-spacing:1.8px; fill:#7A8697; }
      .title { font-size:42px; font-weight:800; letter-spacing:-1.6px; }
      .subtitle { font-size:19px; font-weight:500; fill:#687486; }
      .card-title { font-size:24px; font-weight:800; letter-spacing:-0.6px; }
      .card-subtitle { font-size:15px; font-weight:600; fill:#748095; }
      .label { font-size:17px; font-weight:700; }
      .small { font-size:14px; font-weight:600; fill:#687486; }
      .tiny { font-size:12px; font-weight:700; fill:#8A95A5; letter-spacing:.4px; }
      .step-title { font-size:18px; font-weight:800; }
      .step-copy { font-size:14px; font-weight:600; fill:#6C7788; }
      .flow { fill:none; stroke:#AAB4C3; stroke-width:3; marker-end:url(#arrow); }
      .flow-soft { fill:none; stroke:#C7CFDA; stroke-width:2.5; stroke-dasharray:7 8; marker-end:url(#arrow); }
      .pill-text { font-size:14px; font-weight:700; }
      .inverse { fill:#FFFFFF; }
      .inverse-soft { fill:#AEB7C6; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#FFFFFF"/>
  <text x="72" y="66" class="eyebrow">CUTE ENOUGH · SYSTEM MAP</text>
  <text x="72" y="116" class="title">옆집 강아지 서비스 구조</text>
  <text x="72" y="151" class="subtitle">사용자 경험에서 운영까지 · 현재 구현 기준</text>
  <rect x="1547" y="72" width="181" height="38" rx="19" fill="#F3F5F8"/>
  <text x="1637.5" y="96" text-anchor="middle" class="tiny">UPDATED 2026.09.07</text>

  <!-- Toss platform -->
  <rect x="520" y="182" width="650" height="92" rx="24" fill="#F1F7FF" stroke="#CCE0FF" stroke-width="2"/>
  <circle cx="564" cy="228" r="22" fill="#3182F6"/>
  <text x="564" y="234" text-anchor="middle" font-size="14" font-weight="800" class="inverse">T</text>
  <text x="600" y="220" class="card-title" font-size="21">Toss 플랫폼</text>
  <text x="600" y="247" class="card-subtitle">사용자 식별 · 보상형 광고 · 친구 초대 · 알림 동의/발송</text>
  <rect x="1037" y="205" width="102" height="42" rx="21" fill="#FFFFFF" stroke="#D7E6FF"/>
  <text x="1088" y="231" text-anchor="middle" class="tiny" fill="#3182F6">SDK + mTLS</text>

  <!-- Main flow arrows -->
  <path d="M352 449 H409" class="flow"/>
  <text x="380" y="431" text-anchor="middle" class="tiny">이용</text>
  <path d="M840 449 H909" class="flow"/>
  <text x="875" y="431" text-anchor="middle" class="tiny">HTTPS</text>
  <path d="M1260 449 H1329" class="flow"/>
  <text x="1295" y="431" text-anchor="middle" class="tiny">저장</text>
  <path d="M635 310 V278" class="flow-soft"/>
  <path d="M1090 310 V278" class="flow-soft"/>

  <!-- User -->
  <rect x="72" y="330" width="280" height="310" rx="30" fill="#FFF7F9" stroke="#FFD6E0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="360" width="48" height="30" rx="15" fill="#FF6B8A"/>
  <text x="124" y="380" text-anchor="middle" font-size="13" font-weight="800" class="inverse">01</text>
  <text x="100" y="430" class="card-title">사용자</text>
  <text x="100" y="458" class="card-subtitle">Toss 안에서 만나는 경험</text>
  <line x1="100" y1="484" x2="324" y2="484" stroke="#F0DDE3"/>
  <text x="100" y="522" class="label">오늘의 강아지 집</text>
  <text x="100" y="552" class="label">간식과 교감</text>
  <text x="100" y="582" class="label">사진 · 앨범 · 공유</text>
  <text x="100" y="612" class="label">우리 강아지 등록</text>

  <!-- Mini app -->
  <rect x="420" y="310" width="420" height="330" rx="30" fill="#F7FAFF" stroke="#BFD8FF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="450" y="340" width="48" height="30" rx="15" fill="#3182F6"/>
  <text x="474" y="360" text-anchor="middle" font-size="13" font-weight="800" class="inverse">02</text>
  <text x="450" y="410" class="card-title">옆집 강아지 미니앱</text>
  <text x="450" y="438" class="card-subtitle">React · Apps in Toss AIT</text>
  <rect x="450" y="472" width="166" height="58" rx="16" fill="#FFFFFF" stroke="#DCE8F8"/>
  <text x="533" y="497" text-anchor="middle" class="label">홈 · 교감 · 사진</text>
  <text x="533" y="517" text-anchor="middle" class="tiny">DAILY EXPERIENCE</text>
  <rect x="632" y="472" width="178" height="58" rx="16" fill="#FFFFFF" stroke="#DCE8F8"/>
  <text x="721" y="497" text-anchor="middle" class="label">등록 · 내 강아지</text>
  <text x="721" y="517" text-anchor="middle" class="tiny">OWNER FLOW</text>
  <rect x="450" y="544" width="166" height="58" rx="16" fill="#FFFFFF" stroke="#DCE8F8"/>
  <text x="533" y="569" text-anchor="middle" class="label">티켓 · 재열람</text>
  <text x="533" y="589" text-anchor="middle" class="tiny">ACCESS STATE</text>
  <rect x="632" y="544" width="178" height="58" rx="16" fill="#FFFFFF" stroke="#DCE8F8"/>
  <text x="721" y="569" text-anchor="middle" class="label">앨범 · 공유</text>
  <text x="721" y="589" text-anchor="middle" class="tiny">COLLECTION</text>
  <text x="450" y="624" class="tiny">cute-enough · workspace 17687</text>

  <!-- Edge -->
  <rect x="920" y="310" width="340" height="330" rx="30" fill="#F3FCF8" stroke="#BDE9D7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950" y="340" width="48" height="30" rx="15" fill="#2DBE83"/>
  <text x="974" y="360" text-anchor="middle" font-size="13" font-weight="800" class="inverse">03</text>
  <text x="950" y="410" class="card-title">Supabase Edge</text>
  <text x="950" y="438" class="card-subtitle">서버가 최종 권한을 결정</text>
  <line x1="950" y1="464" x2="1230" y2="464" stroke="#D2EADF"/>
  <text x="950" y="503" class="label">pet-api</text>
  <text x="950" y="530" class="small">집 · 사진 · 등록 · 앨범</text>
  <text x="950" y="557" class="small">티켓 · 광고 · 공유 원장</text>
  <text x="950" y="590" class="label">알림 worker</text>
  <text x="950" y="617" class="small">동의 확인 · 예약 · 중복 방지</text>

  <!-- Data -->
  <rect x="1340" y="310" width="388" height="330" rx="30" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1370" y="340" width="48" height="30" rx="15" fill="#7765E3"/>
  <text x="1394" y="360" text-anchor="middle" font-size="13" font-weight="800" class="inverse">04</text>
  <text x="1370" y="410" class="card-title">데이터와 원본</text>
  <text x="1370" y="438" class="card-subtitle">Supabase · xoqje…ghngm</text>
  <rect x="1370" y="472" width="328" height="63" rx="16" fill="#FFFFFF" stroke="#E8E3F7"/>
  <text x="1392" y="498" class="label">Postgres</text>
  <text x="1392" y="520" class="small">강아지 · 집 · 티켓 · 원장 · 감사 기록</text>
  <rect x="1370" y="547" width="158" height="55" rx="16" fill="#FFFFFF" stroke="#E8E3F7"/>
  <text x="1449" y="571" text-anchor="middle" class="label">비공개 사진</text>
  <text x="1449" y="591" text-anchor="middle" class="tiny">STORAGE</text>
  <rect x="1540" y="547" width="158" height="55" rx="16" fill="#FFFFFF" stroke="#E8E3F7"/>
  <text x="1619" y="571" text-anchor="middle" class="label">최종 캐릭터</text>
  <text x="1619" y="591" text-anchor="middle" class="tiny">PETDESIGN V1</text>
  <text x="1370" y="624" class="tiny">사진·감사 기록은 보존</text>

  <!-- Experience -->
  <rect x="72" y="700" width="1030" height="268" rx="30" fill="#FAFBFC" stroke="#E5E9EF" stroke-width="2"/>
  <text x="104" y="742" class="eyebrow">CORE EXPERIENCE</text>
  <text x="104" y="779" class="card-title">한 번의 만남이 사진과 앨범으로 이어져요</text>
  <rect x="104" y="812" width="210" height="112" rx="20" fill="#FFFFFF" stroke="#E4E8EE"/>
  <text x="126" y="844" class="tiny">01 · HOME</text>
  <text x="126" y="875" class="step-title">오늘의 집</text>
  <text x="126" y="900" class="step-copy">공개 4마리 + 내 강아지</text>
  <path d="M314 868 H350" class="flow"/>
  <rect x="350" y="812" width="210" height="112" rx="20" fill="#FFFFFF" stroke="#E4E8EE"/>
  <text x="372" y="844" class="tiny">02 · PLAY</text>
  <text x="372" y="875" class="step-title">간식과 교감</text>
  <text x="372" y="900" class="step-copy">터치 또는 쓰다듬기 3회</text>
  <path d="M560 868 H596" class="flow"/>
  <rect x="596" y="812" width="210" height="112" rx="20" fill="#FFFFFF" stroke="#E4E8EE"/>
  <text x="618" y="844" class="tiny">03 · REVEAL</text>
  <text x="618" y="875" class="step-title">실사 사진 공개</text>
  <text x="618" y="900" class="step-copy">권한 확정과 동시에 기록</text>
  <path d="M806 868 H842" class="flow"/>
  <rect x="842" y="812" width="226" height="112" rx="20" fill="#FFFFFF" stroke="#E4E8EE"/>
  <text x="864" y="844" class="tiny">04 · KEEP</text>
  <text x="864" y="875" class="step-title">앨범과 공유</text>
  <text x="864" y="900" class="step-copy">모은 사진 · 즐겨찾기 · 링크</text>

  <!-- Operations -->
  <path d="M1534 640 V690" class="flow-soft"/>
  <rect x="1160" y="700" width="568" height="268" rx="30" fill="#FFFCF5" stroke="#F4DFC0" stroke-width="2"/>
  <text x="1192" y="742" class="eyebrow">REVIEW &amp; RELEASE</text>
  <text x="1192" y="779" class="card-title">검수와 출시는 분리해서 관리해요</text>
  <rect x="1192" y="810" width="504" height="46" rx="15" fill="#FFFFFF" stroke="#F0E1C9"/>
  <text x="1212" y="839" class="label">로컬 검수</text>
  <text x="1310" y="839" class="small">실사 비교 · SVG 보정 · 명시적 승인/반려</text>
  <rect x="1192" y="868" width="504" height="46" rx="15" fill="#FFFFFF" stroke="#F0E1C9"/>
  <text x="1212" y="897" class="label">출시 흐름</text>
  <text x="1310" y="897" class="small">GitHub main → AIT → Toss QR → 출시</text>
  <rect x="1192" y="926" width="504" height="28" rx="14" fill="#FFF1D6"/>
  <text x="1444" y="945" text-anchor="middle" class="tiny" fill="#A06518">광고 · 공유 · 알림은 각각 독립 스위치</text>

  <!-- Principles -->
  <rect x="72" y="1000" width="1656" height="80" rx="24" fill="#202938"/>
  <text x="104" y="1048" font-size="17" font-weight="800" class="inverse">핵심 원칙</text>
  <rect x="222" y="1021" width="292" height="38" rx="19" fill="#334055"/>
  <text x="368" y="1045" text-anchor="middle" class="pill-text inverse">서버가 티켓·사진 권한 확정</text>
  <rect x="528" y="1021" width="268" height="38" rx="19" fill="#334055"/>
  <text x="662" y="1045" text-anchor="middle" class="pill-text inverse">pending 공유는 캐릭터만</text>
  <rect x="810" y="1021" width="356" height="38" rx="19" fill="#334055"/>
  <text x="988" y="1045" text-anchor="middle" class="pill-text inverse">승인견은 다음 KST 날짜부터 후보</text>
  <rect x="1180" y="1021" width="388" height="38" rx="19" fill="#334055"/>
  <text x="1374" y="1045" text-anchor="middle" class="pill-text inverse">제작자 확정 전에는 공개하지 않음</text>
  <text x="1695" y="1045" text-anchor="end" class="tiny inverse-soft">구현 ≠ 배포 ≠ 출시</text>
</svg>
