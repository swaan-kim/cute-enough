<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">옆집 강아지 서비스 아키텍처</title>
  <desc id="desc">오늘의 집에서 강아지를 만나고, 마음을 건네고, 사진을 보고, 앨범과 공유로 기억하는 경험을 Toss, 미니앱, 권한 서버, 데이터가 받치는 구조</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#172033" flood-opacity="0.055"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C2CAD5"/>
    </marker>
    <style>
      text { font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif; fill:#202938; }
      .eyebrow { font-size:17px; font-weight:750; letter-spacing:2.4px; fill:#8994A4; }
      .hero { font-size:48px; font-weight:800; letter-spacing:-1.9px; }
      .sub { font-size:21px; font-weight:550; fill:#6F7A8A; }
      .step { font-size:25px; font-weight:800; letter-spacing:-.7px; }
      .step-sub { font-size:16px; font-weight:600; fill:#7B8696; }
      .layer { font-size:18px; font-weight:800; }
      .layer-sub { font-size:13px; font-weight:650; fill:#7A8595; }
      .tech { font-size:11px; font-weight:750; fill:#A0A9B6; letter-spacing:.7px; }
      .inverse { fill:#FFFFFF; }
      .flow { fill:none; stroke:#C2CAD5; stroke-width:3; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#FFFFFF"/>

  <text x="96" y="83" class="eyebrow">CUTE ENOUGH · SERVICE ARCHITECTURE</text>
  <text x="96" y="146" class="hero">문을 열면, 오늘의 이웃이 기다립니다.</text>
  <text x="96" y="189" class="sub">마음을 건네고, 진짜 얼굴을 만나, 기억으로 남기는 작은 서비스</text>

  <!-- Experience -->
  <path d="M400 408 H478" class="flow"/>
  <path d="M792 408 H870" class="flow"/>
  <path d="M1184 408 H1262" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="96" y="302" width="304" height="212" rx="34" fill="#FFF7F9" stroke="#FFD9E2" stroke-width="2"/>
    <circle cx="146" cy="354" r="22" fill="#FF6B8A"/>
    <path d="M134 357 V349 L146 339 L158 349 V357 M139 357 V348 H153 V357" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="424" class="step">오늘의 집</text>
    <text x="130" y="459" class="step-sub">매일 새로 만나는 이웃들</text>

    <rect x="488" y="302" width="304" height="212" rx="34" fill="#F7FAFF" stroke="#C9DEFF" stroke-width="2"/>
    <circle cx="538" cy="354" r="22" fill="#3182F6"/>
    <path d="M528 351 C528 343 539 342 539 350 C539 342 550 343 550 351 C550 359 539 365 539 365 C539 365 528 359 528 351 Z" fill="#FFFFFF"/>
    <text x="522" y="424" class="step">마음을 건네기</text>
    <text x="522" y="459" class="step-sub">간식 한 번, 쓰다듬기 세 번</text>

    <rect x="880" y="302" width="304" height="212" rx="34" fill="#F3FCF8" stroke="#C4EBD9" stroke-width="2"/>
    <circle cx="930" cy="354" r="22" fill="#2DBE83"/>
    <rect x="919" y="344" width="22" height="17" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="930" cy="352.5" r="4" fill="#FFFFFF"/>
    <path d="M923 344 L926 339 H934 L937 344" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <text x="914" y="424" class="step">진짜 얼굴</text>
    <text x="914" y="459" class="step-sub">캐릭터 너머의 사진</text>

    <rect x="1272" y="302" width="432" height="212" rx="34" fill="#FBFAFF" stroke="#DED8FA" stroke-width="2"/>
    <circle cx="1322" cy="354" r="22" fill="#7765E3"/>
    <path d="M1312 343 H1322 V365 H1312 Z M1322 343 H1332 V365 H1322" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <text x="1306" y="424" class="step">기억하기</text>
    <text x="1306" y="459" class="step-sub">앨범에 모으고, 친구와 나누기</text>
  </g>

  <!-- Service backbone -->
  <rect x="96" y="606" width="1608" height="238" rx="38" fill="#F8FAFC" stroke="#E4E9F0" stroke-width="2"/>
  <text x="132" y="654" class="eyebrow">THE QUIET BACKBONE</text>
  <text x="132" y="690" font-size="20" font-weight="750">보이지 않는 곳에서, 만남이 안전하게 이어집니다.</text>

  <path d="M430 756 H506" class="flow"/>
  <path d="M818 756 H894" class="flow"/>
  <path d="M1206 756 H1282" class="flow"/>

  <g>
    <circle cx="214" cy="756" r="34" fill="#EAF3FF"/>
    <text x="214" y="764" text-anchor="middle" font-size="17" font-weight="850" fill="#3182F6">T</text>
    <text x="266" y="749" class="layer">Toss</text>
    <text x="266" y="776" class="layer-sub">입장 · 초대 · 알림</text>
    <text x="266" y="803" class="tech">PLATFORM</text>

    <circle cx="602" cy="756" r="34" fill="#FFF0F4"/>
    <circle cx="602" cy="756" r="10" fill="#FF6B8A"/>
    <text x="654" y="749" class="layer">옆집 강아지</text>
    <text x="654" y="776" class="layer-sub">오늘의 집과 교감</text>
    <text x="654" y="803" class="tech">MINIAPP</text>

    <circle cx="990" cy="756" r="34" fill="#EAF9F2"/>
    <path d="M978 756 H1002 M990 744 V768" stroke="#2DBE83" stroke-width="4" stroke-linecap="round"/>
    <text x="1042" y="749" class="layer">권한과 보상</text>
    <text x="1042" y="776" class="layer-sub">티켓 · 사진 접근</text>
    <text x="1042" y="803" class="tech">EDGE SERVICE</text>

    <circle cx="1378" cy="756" r="34" fill="#F1EEFF"/>
    <ellipse cx="1378" cy="746" rx="13" ry="6" fill="none" stroke="#7765E3" stroke-width="3"/>
    <path d="M1365 746 V766 C1365 774 1391 774 1391 766 V746" fill="none" stroke="#7765E3" stroke-width="3"/>
    <text x="1430" y="749" class="layer">사진과 기억</text>
    <text x="1430" y="776" class="layer-sub">강아지 · 앨범 · 기록</text>
    <text x="1430" y="803" class="tech">DATA &amp; STORAGE</text>
  </g>

  <rect x="96" y="900" width="1608" height="82" rx="27" fill="#202938"/>
  <text x="132" y="951" font-size="19" font-weight="750" class="inverse">새 이웃은 만든 이의 확인을 거쳐, 다음 날부터 다른 집을 찾아갑니다.</text>
  <text x="1668" y="951" text-anchor="end" font-size="14" font-weight="650" fill="#BBC4D1">검수와 공개는 천천히, 기억은 오래</text>
</svg>
